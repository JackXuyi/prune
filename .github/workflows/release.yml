name: Release Desktop

# 触发：
#   - push tag（v0.1.1 之类）：三平台并行构建，产物先挂到 Draft Release；
#     `release-notes` job 在三条 bundle 全部成功后同步正文并发布（draft → public），
#     因为草稿对 updater 的 latest.json 不可见，留草稿等于自动更新收不到这一版
#   - 手动 workflow_dispatch：用当前版本号构建（不会自动改版本号），同样走
#     Draft → 正文同步 → 发布的完整链路；对已存在的同版本 Release 是幂等重跑
#
# 版本号由 scripts/bump-version.mjs 统一维护（package.json / tauri.conf.json / src-tauri/Cargo.toml），
# 因此打 tag 前请先 pnpm bump，否则 verify 任务会直接失败。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 同一个 ref 的构建串行执行，避免两次 tag 构建争抢同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 统一 Node / pnpm 版本，与本地开发保持一致
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # 快速门禁：版本号三处一致 + tsc 类型检查 + 前端构建（约 1 分钟）
  # 放在前面，避免版本号写错还白跑三个平台的 Rust 编译
  # ---------------------------------------------------------------------------
  verify:
    name: Verify version & frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 必须 >= 10：pnpm-workspace.yaml 里只有 allowBuilds（pnpm 10+ 才认的配置键），
      # 没有 packages 字段，pnpm 9 会直接报 "packages field missing or empty" 并中止。
      # 版本对齐 .workflow/prune-ci.yml（Gitee Go 同样用 pnpm@11）。
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: |
          V_PKG=$(node -p "require('./package.json').version")
          V_TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          V_CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "package.json=$V_PKG tauri.conf.json=$V_TAURI Cargo.toml=$V_CARGO"
          if [ "$V_PKG" != "$V_TAURI" ] || [ "$V_PKG" != "$V_CARGO" ]; then
            echo "::error::版本号不一致，请先执行 pnpm bump <patch|minor|major|x.y.z>"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$V_PKG" ]]; then
            echo "::error::tag $GITHUB_REF_NAME 与版本号 v$V_PKG 不匹配"
            exit 1
          fi
          echo "OK: v$V_PKG"

      # macOS 签名材料自检：宁可在这里 2 秒失败，也不要等三平台各编 2 分钟 Rust
      # 才倒在 codesign 前面。openssl 能验完 CI 真正关心的三件事：
      # 是不是合法 PKCS#12、密码对不对、有没有私钥。
      - name: Preflight macOS signing secrets
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -uo pipefail

          if [[ -z "${CERT_B64}" ]]; then
            echo "::notice::未配置 APPLE_CERTIFICATE → macOS 走 ad-hoc 签名"
            if [[ -n "${SIGN_IDENTITY}" ]]; then
              echo "::warning::APPLE_SIGNING_IDENTITY 已配置但 APPLE_CERTIFICATE 为空，签名会退化为 ad-hoc"
            fi
            exit 0
          fi

          fail=0
          if [[ -z "${CERT_PASSWORD}" ]]; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD 未配置"
            fail=1
          fi
          if [[ -z "${SIGN_IDENTITY}" ]]; then
            echo "::error::APPLE_SIGNING_IDENTITY 未配置，要填证书名，如 Developer ID Application: XXX (TEAMID)"
            fail=1
          fi
          [[ ${fail} -eq 1 ]] && exit 1

          # tauri 解 p12 时不接受空白字符，base64 一旦折行就解不开
          if printf '%s' "${CERT_B64}" | grep -qE '[[:space:]]'; then
            echo "::error::APPLE_CERTIFICATE 含空白字符（base64 被折行了）。重新生成: openssl base64 -A -in cert.p12 | pbcopy"
            exit 1
          fi

          p12="${RUNNER_TEMP}/signing.p12"
          printf '%s' "${CERT_B64}" | base64 -d > "${p12}"
          echo "p12 解码后 $(wc -c < "${p12}") 字节"

          # openssl 3 默认拒收 RC2/3DES 老格式的 p12，失败回退 -legacy 再试一次
          if openssl pkcs12 -info -noout -in "${p12}" -passin env:CERT_PASSWORD >/dev/null 2>&1; then
            legacy=""
          elif openssl pkcs12 -info -noout -legacy -in "${p12}" -passin env:CERT_PASSWORD >/dev/null 2>&1; then
            legacy="-legacy"
          else
            echo "::error::APPLE_CERTIFICATE 不是合法 .p12，或者密码不对。常见原因：放的是 .cer/.pem 的 base64（没有私钥、不是 PKCS#12）"
            openssl pkcs12 -info -noout -in "${p12}" -passin env:CERT_PASSWORD 2>&1 | tail -5 || true
            exit 1
          fi

          # 没有私钥的 p12 签不了名，早报早省事
          if ! openssl pkcs12 -nocerts -nodes ${legacy} -in "${p12}" -passin env:CERT_PASSWORD 2>/dev/null | grep -q "PRIVATE KEY"; then
            echo "::error::p12 里没有私钥。回钥匙串重新导出：必须同时选中证书和它的私钥，格式选 .p12"
            exit 1
          fi

          echo "OK: p12 合法 / 密码正确 / 含私钥 / identity=${SIGN_IDENTITY}"

      # updater 升级包签名密钥自检：bundle 开了 createUpdaterArtifacts 后，
      # 没有私钥 tauri 会在签名阶段直接失败。宁可在这里 2 秒报清楚原因，
      # 也不要等三平台 Rust 编译完才倒在 .sig 生成上。
      - name: Preflight updater signing key
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "${UPDATER_KEY}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 未配置。到 Settings → Secrets and variables → Actions 添加（本地生成命令：pnpm tauri signer generate，见 docs/updater-plan.md）"
            exit 1
          fi
          echo "OK: TAURI_SIGNING_PRIVATE_KEY 已配置（password ${UPDATER_KEY_PASSWORD:+已设置}${UPDATER_KEY_PASSWORD:-为空，对应无密码密钥}）"

      # 文档诚信门禁（M1）：MCP 工具三处对账（run_tool ↔ tool_defs ↔ README）
      # + 排他表述 sweep（README/CHANGELOG/spec，DP-4 裁 A）。纯静态解析零构建。
      # 不只挂在 pnpm build 链里，还独立成步——CI 日志里一眼可见门禁结果。
      - name: Docs honesty (MCP reconciliation + exclusivity sweep)
        run: node scripts/check-docs-honesty.mjs

      - name: Typecheck & build frontend
        run: pnpm build

      # ---------------------------------------------------------------------------
      # Rust 单测门禁：prune-core（含全部安全护栏负面测试：白名单外拒绝 / home 本体
      # 拒绝 / symlink 逃逸 / 伪造 allowed 表拒绝 / 20GB 熔断）+ prune-cli 在 Linux
      # 上可独立编译（纯逻辑 crate，零 Tauri 依赖，rusqlite bundled 免系统库）。
      # src-tauri 的 macOS 专属测试不在此跑：Linux 起 webkit2gtk 不划算，
      # 其编译正确性由 bundle job 三平台覆盖。
      # fmt / clippy 门禁（2026-11 一次性 cargo fmt --all 统一 + 35 条 clippy warning
      # 清零后启用，-D warnings 即「有告警就红」）。clippy 只跑 Linux 可编译的
      # prune-core / prune-cli；src-tauri 同样零告警，但需 macOS 依赖，由本地
      # `cargo clippy --workspace --all-targets -- -D warnings` 覆盖。
      # ---------------------------------------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust fmt check
        run: cargo fmt --all -- --check

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: verify-linux-tests

      - name: Rust clippy (-D warnings)
        run: cargo clippy -p prune-core -p prune-cli --all-targets -- -D warnings

      # --no-fail-fast：默认一个测试二进制失败就中止，Linux 专属的失败（本地 macOS
      # 编译不到的 cfg 分支）只能在这里暴露，逐轮修代价太大。一次跑完所有二进制，
      # 让一次运行报全所有失败用例；退出码仍为非 0，门禁强度不变。
      - name: Rust unit tests (prune-core + prune-cli)
        run: cargo test -p prune-core -p prune-cli --no-fail-fast

  # ---------------------------------------------------------------------------
  # 三平台打包
  #   macOS arm64 / macOS x64 都在 macos-latest（Apple Silicon）上交叉编译，
  #   不依赖已下线的 macos-13 Intel runner。
  #   Windows 走 MSVC，产出 .msi + NSIS .exe。
  # ---------------------------------------------------------------------------
  bundle:
    name: Bundle ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64 (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS x64 (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Rust 工作区根在仓库根目录（members = src-tauri / crates/*），产物在 ./target
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # macOS 签名：三件套（证书 + 密码 + identity）齐全才启用，否则显式降级 ad-hoc。
      #
      # 为什么用 GITHUB_ENV 动态注入，而不是在 build step 里写 secrets.X || ''：
      # tauri-bundler 的 keychain() 用的是
      #   var_os("APPLE_CERTIFICATE") + var_os("APPLE_CERTIFICATE_PASSWORD")
      # 空字符串也算「存在」，照样会去 import 一个空文件，于是照样炸在
      #   SecKeychainItemImport: Unable to decode the provided data
      # 唯一可靠的做法是 ad-hoc 模式下让这两个变量彻底不存在。
      #
      # 另外 tauri 会校验「证书里的身份」是否包含 APPLE_SIGNING_IDENTITY，
      # 所以 identity 必须是证书全名，配 '-' 会报 does not match provided identity。
      - name: Resolve macOS signing mode
        if: matrix.platform == 'macos-latest'
        id: signing
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KC_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${CERT_B64}" || -z "${CERT_PASSWORD}" || -z "${SIGN_IDENTITY}" ]]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "::warning::签名三件套不全 → 使用 ad-hoc 签名。产物未公证，用户首次打开需右键 → 打开（或 xattr -cr /Applications/Prune.app）"
            exit 0
          fi

          {
            echo "APPLE_SIGNING_IDENTITY=${SIGN_IDENTITY}"
            echo "APPLE_CERTIFICATE=${CERT_B64}"
            echo "APPLE_CERTIFICATE_PASSWORD=${CERT_PASSWORD}"
          } >> "$GITHUB_ENV"

          if [[ -n "${KC_PASSWORD}" ]]; then
            echo "KEYCHAIN_PASSWORD=${KC_PASSWORD}" >> "$GITHUB_ENV"
          fi

          # 公证只在正式签名下有意义：ad-hoc 签名提交 notarytool 必被拒，
          # 而且报错是凭据相关的，很容易误判成 secret 配错。
          if [[ -n "${NOTARY_ID}" && -n "${NOTARY_PASSWORD}" && -n "${NOTARY_TEAM}" ]]; then
            {
              echo "APPLE_ID=${NOTARY_ID}"
              echo "APPLE_PASSWORD=${NOTARY_PASSWORD}"
              echo "APPLE_TEAM_ID=${NOTARY_TEAM}"
            } >> "$GITHUB_ENV"
            echo "公证: 已启用（${NOTARY_ID}）"
          else
            echo "::notice::APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 未配全 → 跳过公证"
          fi

          echo "mode=signed" >> "$GITHUB_OUTPUT"
          echo "正式签名: ${SIGN_IDENTITY}"

      - name: Build & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 升级包签名（docs/updater-plan.md）：私钥不进仓库，
          # verify 任务的 preflight 已确认两个 secret 都在。密钥对由
          # `pnpm tauri signer generate` 生成，公钥内置在 tauri.conf.json。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # D-02：显式告知 prepare-cli-resource.mjs 该腿的目标架构。不能只依赖
          # Tauri 注入的 TAURI_ENV_TARGET_TRIPLE——cross 编译（arm64 host 出 x64 包）
          # 时若它缺位，脚本会退回 rustc host，把 arm64 二进制塞进 x64 的 dmg。
          CLI_TARGET_TRIPLE: ${{ matrix.target }}
          # 签名/公证变量由上面的 "Resolve macOS signing mode" 动态注入：
          #   三件套齐全 → 正式签名（含可选公证）
          #   缺任意一项 → 只有 APPLE_SIGNING_IDENTITY=-（ad-hoc）
          # 不要在这里写 ${{ secrets.X || '' }} 兜底：空字符串仍然算「变量存在」，
          # tauri 会照样去 import 空 p12，把发版挂掉（v0.1.0 首次运行的真实失败原因）。
        with:
          tagName: v__VERSION__
          releaseName: 'Prune v__VERSION__'
          releaseBody: |
            下载对应平台安装包：

            | 平台 | 文件 |
            |---|---|
            | macOS Apple Silicon | `Prune_*_aarch64.dmg` |
            | macOS Intel | `Prune_*_x64.dmg` |
            | macOS CLI (universal) | `Prune_CLI_*_universal_macos.tar.gz` |
            | Windows x64 | `Prune_*_x64-setup.exe`（推荐） / `Prune_*_x64_en-US.msi` |

            已装旧版本可通过托盘菜单「检查更新」或应用内自动升级直接更新到本版本。

            macOS 首次打开若提示未验证开发者：右键 → 打开，或 `xattr -cr /Applications/Prune.app`。
          releaseDraft: true
          prerelease: false
          # 生成 latest.json（updater 清单）：三个 job 并行跑，tauri-action 会把
          # 各自的平台条目合并进 Release 上已存在的 latest.json
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # D-02（docs/d02-homebrew-plan.md §3.2）：把 CLI 二进制（beforeBuildCommand
      # 由 prepare-cli-resource.mjs 编出，与 GUI 同 target）传给 cli-universal job
      # 做 lipo 合并。formula 需要单 URL 的 universal tar.gz。
      - name: Upload CLI binary artifact (for universal asset)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/prune
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # D-02：CLI universal 产物（docs/d02-homebrew-plan.md §3.2）。
  # 两条 macOS 腿的 CLI 二进制 lipo 成 universal 单文件 → tar.gz → 传到
  # （仍是 draft 的）Release。必须在 release-notes 发布前完成——draft 对
  # /releases/tags/{tag} 一律 404，所以沿用 list 端点按 tag_name 找的路径，
  # 同时先删同名旧 asset 保证同 tag 幂等重跑。
  # ---------------------------------------------------------------------------
  cli-universal:
    name: CLI universal binary asset
    needs: bundle
    runs-on: macos-latest
    steps:
      - name: Download per-arch CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: false
          path: cli-arch

      - name: Merge universal CLI & pack
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 资产名不能带 v 前缀：dmg 是 Prune_0.13.1_aarch64.dmg，brew-tap.mjs 渲染的
          # formula URL 也用 #{version}（0.13.1）——带 v 会让 formula 的 URL 404。
          VERSION="${REF_NAME#v}"
          ASSET_NAME="Prune_CLI_${VERSION}_universal_macos.tar.gz"

          lipo -create \
            "cli-arch/cli-aarch64-apple-darwin/prune" \
            "cli-arch/cli-x86_64-apple-darwin/prune" \
            -output prune
          chmod +x prune
          file prune
          echo "archs: $(lipo -archs prune)"

          # tar 根目录直接放 prune：formula 的 install 是 bin.install "prune"，
          # 多包一层目录会让它在新版本上直接报找不到文件。
          tar czf "$ASSET_NAME" prune
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          shasum -a 256 "$ASSET_NAME"

      - name: Upload to (draft) release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export RELEASE_TAG="${{ github.ref_name }}"
          node <<'NODE_SCRIPT'
          const fs = require('fs');
          const headers = { Authorization: `token ${process.env.GH_TOKEN}` };
          const repo = process.env.GH_REPO;
          const tag = process.env.RELEASE_TAG;
          const assetName = process.env.ASSET_NAME;
          (async () => {
            // 草稿对 /releases/tags/{tag} 返回 404，列表端点在 contents:write 下包含草稿
            const listRes = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=100`, { headers });
            if (!listRes.ok) throw new Error(`GET releases failed: ${listRes.status} ${await listRes.text()}`);
            const releases = await listRes.json();
            const meta = releases.find((r) => r.tag_name === tag);
            if (!meta) throw new Error(`找不到 ${tag} 的 Release：bundle 三腿是否都成功？`);
            // 幂等：删除同名旧 asset 再传
            for (const a of meta.assets ?? []) {
              if (a.name === assetName) {
                const del = await fetch(`https://api.github.com/repos/${repo}/releases/assets/${a.id}`, { method: 'DELETE', headers });
                if (!del.ok && del.status !== 204) throw new Error(`删除旧 asset 失败: ${del.status}`);
                console.log(`已删除旧 asset：${assetName}`);
              }
            }
            const body = fs.readFileSync(assetName);
            const up = await fetch(`${meta.upload_url.replace(/\{\?.*$/, '')}?name=${assetName}`, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/octet-stream', 'Content-Length': body.length },
              body: body,
            });
            if (!up.ok) throw new Error(`上传 asset 失败: ${up.status} ${await up.text()}`);
            console.log(`✓ CLI universal asset 已上传：${assetName}`);
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE_SCRIPT

  # ---------------------------------------------------------------------------
  # 双源发布归真（M1/R15）：GitHub 与 Gitee 的 Release 正文讲同一个故事。
  # tauri-action 的 releaseBody 是静态模板，拿不到每版的变更内容；此 job 在
  # 三个 bundle 全部完成后跑一次（矩阵三腿并发 PATCH 会互相覆盖，所以收敛为
  # 单点），把 CHANGELOG 本版段拼进「下载表」之后。Gitee 侧由 release.mjs 的
  # releaseBody() 同步生成同一结构——两边一致，不再各说各话。
  # ---------------------------------------------------------------------------
  release-notes:
    name: Sync release notes with CHANGELOG
    needs: [bundle, cli-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch release body + updater manifest notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export RELEASE_TAG="v$(node -p "require('./package.json').version")"
          node <<'NODE_SCRIPT'
          const fs = require('fs');
          const token = process.env.GITHUB_TOKEN;
          const repo = process.env.GH_REPO;
          const tag = process.env.RELEASE_TAG;
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' };
          (async () => {
            // CHANGELOG 本版段：到下一个二级标题为止，不拦腰截断；缺段只告警不阻塞
            const t = fs.readFileSync('CHANGELOG.md', 'utf8');
            const i = t.indexOf('## ' + tag.slice(1));
            let section = '';
            if (i >= 0) {
              const rest = t.slice(i);
              const n = rest.indexOf('\n## ', 1);
              section = (n === -1 ? rest : rest.slice(0, n)).trim();
            } else {
              console.log(`::warning::CHANGELOG 里没有 ${tag} 段，Release 正文只保留下载表，updater notes 沿用原值`);
            }
            const table = [
              '下载对应平台安装包：',
              '',
              '| 平台 | 文件 |',
              '|---|---|',
              '| macOS Apple Silicon | `Prune_*_aarch64.dmg` |',
              '| macOS Intel | `Prune_*_x64.dmg` |',
              '| macOS CLI (universal) | `Prune_CLI_*_universal_macos.tar.gz` |',
              '| Windows x64 | `Prune_*_x64-setup.exe`（推荐） / `Prune_*_x64_en-US.msi` |',
              '',
              '已装旧版本可通过托盘菜单「检查更新」或应用内自动升级直接更新到本版本。',
              '',
              'macOS 首次打开若提示未验证开发者：右键 → 打开，或 `xattr -cr /Applications/Prune.app`。',
            ].join('\n');
            const body = section ? `${table}\n\n${section}` : table;
            // 草稿 Release 不能走 /releases/tags/{tag}：GitHub 对 draft 一律返回 404
            // （v0.9.4 / v0.10.0 首发的真实失败原因——三条 bundle 全绿、只有本步挂掉）。
            // 列表端点在 contents:write 下包含草稿，按 tag_name 匹配才是可靠路径。
            const listRes = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=100`, { headers });
            if (!listRes.ok) throw new Error(`GET releases failed: ${listRes.status} ${await listRes.text()}`);
            const releases = await listRes.json();
            const meta = releases.find((r) => r.tag_name === tag);
            if (!meta) throw new Error(`找不到 ${tag} 的 Release：tauri-action 的三条 bundle 是否都上传成功？`);
            // draft: false 一并发布：tag 推送本身就是「发这一版」的意图，
            // 而草稿状态的 Release 对 updater 的 latest.json 不可见——留草稿等于
            // 自动更新永远收不到这一版。正文同步成功后才发布，失败则保持草稿。
            const patch = await fetch(`https://api.github.com/repos/${repo}/releases/${meta.id}`, {
              method: 'PATCH',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ body, draft: false }),
            });
            if (!patch.ok) throw new Error(`PATCH release failed: ${patch.status} ${await patch.text()}`);
            console.log(`✓ GitHub Release #${meta.id} 已同步正文并发布：下载表 + CHANGELOG${section ? ` ${tag} 段` : '（无本版段）'}`);

            // updater 清单（latest.json）的 notes：tauri-action 生成时写死为 releaseBody
            // 静态下载表模板，不是真正的更新说明。这里把 notes 改写成同一份 CHANGELOG
            // 本版段，让「发现新版本」弹窗 / 面板卡片看到的是本版变更而非下载表。
            // 只动 notes 字段——platforms 里的下载 URL 与 .sig 签名逐字保留，
            // 客户端只校验安装包签名（校验对象是下载字节，不是清单本身），改 notes 不影响升级链路。
            if (!section) {
              console.log('⏭ CHANGELOG 无本版段，跳过 latest.json notes 改写');
              return;
            }
            const assetsRes = await fetch(`https://api.github.com/repos/${repo}/releases/${meta.id}/assets?per_page=100`, { headers });
            if (!assetsRes.ok) throw new Error(`GET assets failed: ${assetsRes.status} ${await assetsRes.text()}`);
            const assets = await assetsRes.json();
            const manifest = assets.find((a) => a.name === 'latest.json');
            if (!manifest) throw new Error(`Release #${meta.id} 里没有 latest.json 资产（tauri-action includeUpdaterJson 是否生效？）`);
            // 下载资产内容：API 端点 + octet-stream 拿原始字节，不是浏览器下载页
            const dl = await fetch(manifest.url, { headers: { ...headers, Accept: 'application/octet-stream' } });
            if (!dl.ok) throw new Error(`下载 latest.json 失败: ${dl.status} ${await dl.text()}`);
            const json = await dl.json();
            json.notes = section;
            const manifestBody = JSON.stringify(json, null, 2);

            // GitHub asset 不支持原地改内容，只能 DELETE + POST 上传同名文件。
            // 顺序：先删后传；删成功但传失败会留下缺失清单的窗口——此时升级检查会拿到
            // 404（客户端当「已是最新」静默处理，不阻塞任何人），重跑本 job 即可恢复。
            const del = await fetch(manifest.url, { method: 'DELETE', headers });
            if (!del.ok) throw new Error(`删除旧 latest.json 失败: ${del.status} ${await del.text()}`);
            const uploadUrl = `https://uploads.github.com/repos/${repo}/releases/${meta.id}/assets?name=latest.json`;
            const up = await fetch(uploadUrl, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/octet-stream' },
              body: manifestBody,
            });
            if (!up.ok) throw new Error(`上传 latest.json 失败: ${up.status} ${await up.text()}`);
            console.log(`✓ latest.json 的 notes 已改写为 ${tag} 的 CHANGELOG 段（platforms 签名未动）`);
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE_SCRIPT

  # ---------------------------------------------------------------------------
  # D-02：发版后自动更新 Homebrew tap（docs/d02-homebrew-plan.md §3.3）。
  # 渲染 cask + formula（sha256 从已发布的资产实算）并推送 JackXuyi/homebrew-prune。
  # 仅 tag 触发（workflow_dispatch 是对现有版本的幂等重跑，不该动 tap）；
  # tap 仓库或 HOMEBREW_TAP_TOKEN secret 缺失时显式失败——静默跳过会让 tap 停在旧版。
  # 幂等：渲染内容与 tap 现状一致时不产生新 commit。
  # ---------------------------------------------------------------------------
  homebrew-tap:
    name: Update homebrew tap
    needs: release-notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render cask & formula, push to tap
        env:
          PRUNE_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/brew-tap.mjs
