[package]
name = "prune-app"
version = "0.3.0"
edition = "2021"
description = "Prune 桌面端（Tauri 2 壳）"

[lib]
name = "prune_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
# GitHub 源自动升级（docs/updater-plan.md）：latest.json + minisign 签名校验
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prune-core = { path = "../crates/prune-core" }
tokio = { version = "1.54.1", features = ["time", "macros"] }
# 菜单栏数字的总网速采样（M13）：与 prune-core 同版本，不引入第二份编译产物
sysinfo = "0.39.6"

# NSPopover 原生化（docs/ns-popover-plan.md）。版本对齐 Cargo.lock 中 Tauri 已锁定的
# objc2-app-kit 0.3.2 —— 不引入新的编译产物，只追加 feature。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3", features = [
    "NSPopover",
    "NSViewController",
    "NSView",
    "NSWindow",
    "NSResponder",
    "NSApplication",
    "NSGraphics",
    "NSColor",
    "NSEvent",
    "NSUserInterfaceValidation",
] }
# CALayer 圆角裁剪（objc2-app-kit 已带入依赖树）
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMediaTiming"] }
