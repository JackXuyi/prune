[package]
name = "prune-core"
version = "0.1.0"
edition = "2021"
description = "Prune 核心逻辑：磁盘浪费探测 / 内存口径 / 白名单清理 —— GUI 与 CLI 共享"

[dependencies]
libc = "0.2.191"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
trash = "5"

# W2：Windows 系统调用（GlobalMemoryStatusEx / GetProcessMemoryInfo）。
# 用官方绑定而不是手写 extern：PROCESS_MEMORY_COUNTERS 一旦结构布局写错，
# 读出来是垃圾数值，而这种错误在 macOS 上永远测不出来。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  # 网络诊断：GetIpForwardTable2 拿默认网关；MIB_IPFORWARD_ROW2 内嵌 NET_LUID_LH
  #（Ndis feature），两者必须一起开
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  # M14：本地日期（FileTimeToSystemTime + SystemTimeToTzSpecificLocalTime）
  "Win32_System_Time",
] }
