[workspace]
resolver = "2"
members = ["src-tauri", "crates/prune-core", "crates/prune-cli"]

[workspace.package]
edition = "2021"
# 单一版本来源：prune-core / prune-cli 通过 version.workspace = true 继承；
# src-tauri 因 release.yml 的 grep 校验保持显式版本，由 scripts/bump-version.mjs 同步
version = "0.9.0"
license = "MIT"

[profile.release]
strip = true
lto = true
